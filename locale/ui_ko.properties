tools/scene_builder/title = 장면 빌더
tools/scene_builder/hint = 노드는 본체나 핸들로 끌어 옮기기 · 클릭 — 커서 아래 노드 선택 · Del — 노드 삭제 · Ctrl+S — 저장하고 다시 빌드
tools/scene_builder/base_scene = 모드 장면을 겹쳐 보여 줄 기본 장면
tools/scene_builder/mod = 모드
tools/scene_builder/scene = 모드 장면 (.tscn)
tools/scene_builder/empty_scene = (빈 기본 장면)
tools/scene_builder/select_mod = — 모드 선택 —
tools/scene_builder/select_scene = — 장면 선택 —
tools/scene_builder/save_tip = .tscn을 저장하고 미리 보기를 다시 빌드 (Ctrl+S)
tools/scene_builder/reload = 디스크에서 다시 읽기
tools/scene_builder/reload_tip = 저장하지 않은 편집을 버리고 장면 파일을 다시 읽습니다
tools/scene_builder/reloaded = 디스크에서 장면을 다시 읽었습니다.
tools/scene_builder/saved_ok = 저장했습니다.
tools/scene_builder/saved_rebuilt = 저장했고, 미리 보기를 다시 빌드했습니다.
tools/scene_builder/autosaved = 자동 저장했습니다.
tools/scene_builder/error_save = 저장 오류: 모드가 읽기 전용입니다.
tools/scene_builder/error_no_scene = 먼저 모드 장면을 고르세요.
tools/scene_builder/hierarchy = 계층
tools/scene_builder/hierarchy_hint = 금색 — 모드 장면의 루트, 밝은색 — 편집 가능한 노드, 흐린색 — 기본 장면(읽기 전용).
tools/scene_builder/node_type_tip = 새 노드의 유형
tools/scene_builder/add_node_tip = 선택한 노드(또는 장면 루트) 안에 고른 유형의 노드를 추가합니다
tools/scene_builder/delete_node_tip = 선택한 모드 장면 노드 삭제
tools/scene_builder/delete_node_title = 노드 삭제
tools/scene_builder/delete_node_confirm = 선택한 노드를 자식과 함께 삭제할까요? 파일은 자동으로 저장됩니다.
tools/scene_builder/refresh_tip = 노드 트리 새로 고침
tools/scene_builder/tab_inspector = 인스펙터
tools/scene_builder/tab_tscn = .tscn 소스
tools/scene_builder/tscn_hint = 인스펙터와 핸들로 한 편집은 저절로 저장됩니다. 텍스트를 직접 고친 내용은 Ctrl+S로 저장하며, 그때 미리 보기도 다시 빌드됩니다.
tools/scene_builder/inspector_cat_container = 컨테이너 안
tools/scene_builder/inspector_select = 속성을 편집하려면 모드 장면의 노드를 고르세요
tools/scene_builder/inspector_readonly = 읽기 전용: 기본 장면에 속한 노드입니다
tools/scene_builder/inspector_missing_section = tscn에서 노드 섹션을 찾을 수 없습니다(인스턴스화한 하위 장면의 노드는 아직 편집할 수 없습니다)
tools/scene_builder/inspector_preset = 앵커 프리셋
tools/scene_builder/inspector_cat_layout = 레이아웃
tools/scene_builder/inspector_cat_rect = 사각형
tools/scene_builder/inspector_cat_visibility = 보이기
tools/scene_builder/inspector_cat_misc = 기타
tools/scene_builder/inspector_bad_value = 이 값은 tscn에 쓸 수 없습니다.
tools/scene_builder/inspector_in_file_tooltip = tscn 파일에 저장됨
tools/scene_builder/inspector_container_banner = 이 노드는 컨테이너가 관리합니다: 앵커와 오프셋은 부모가 다시 계산하므로 여기서는 효과가 없습니다.
tools/scene_builder/err_add_failed = 오류: 이 유형의 노드를 만들 수 없습니다.
tools/scene_builder/err_add_parent_missing = 오류: tscn에서 부모 섹션을 찾을 수 없습니다(인스턴스화한 하위 장면의 부모는 지원하지 않습니다).
tools/scene_builder/err_del_root = 오류: 장면 루트는 삭제할 수 없습니다.
tools/scene_builder/err_del_none = 오류: 삭제할 모드 노드를 고르세요.
