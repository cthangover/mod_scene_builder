tools/scene_builder/title = 场景构建器
tools/scene_builder/hint = 拖动节点本体或手柄 · 点击——选择光标下的节点 · Del——删除节点 · Ctrl+S——保存并重建
tools/scene_builder/base_scene = 显示模组场景的基础场景
tools/scene_builder/mod = 模组
tools/scene_builder/scene = 模组场景（.tscn）
tools/scene_builder/empty_scene = （空的基础场景）
tools/scene_builder/select_mod = — 选择模组 —
tools/scene_builder/select_scene = — 选择场景 —
tools/scene_builder/save_tip = 保存 .tscn 并重建预览（Ctrl+S）
tools/scene_builder/reload = 从磁盘重新加载
tools/scene_builder/reload_tip = 放弃未保存的修改并重新读取场景文件
tools/scene_builder/reloaded = 已从磁盘重新加载场景。
tools/scene_builder/saved_ok = 已保存。
tools/scene_builder/saved_rebuilt = 已保存，预览已重建。
tools/scene_builder/autosaved = 已自动保存。
tools/scene_builder/error_save = 保存错误：模组是只读的。
tools/scene_builder/error_no_scene = 请先选择一个模组场景。
tools/scene_builder/hierarchy = 层级
tools/scene_builder/hierarchy_hint = 金色——模组场景根节点，亮色——可编辑的节点，暗色——基础场景（只读）。
tools/scene_builder/node_type_tip = 新节点的类型
tools/scene_builder/add_node_tip = 在选中的节点（或场景根节点）中添加所选类型的节点
tools/scene_builder/delete_node_tip = 删除选中的模组场景节点
tools/scene_builder/delete_node_title = 删除节点
tools/scene_builder/delete_node_confirm = 删除选中的节点及其子节点？文件会自动保存。
tools/scene_builder/refresh_tip = 刷新节点树
tools/scene_builder/tab_inspector = 检查器
tools/scene_builder/tab_tscn = .tscn 源码
tools/scene_builder/tscn_hint = 检查器和手柄的修改会自动保存；手动修改文本需用 Ctrl+S 保存，同时会重建预览。
tools/scene_builder/inspector_cat_container = 在容器中
tools/scene_builder/inspector_select = 选择模组场景中的一个节点来编辑其属性
tools/scene_builder/inspector_readonly = 只读：该节点属于基础场景
tools/scene_builder/inspector_missing_section = 在 tscn 中找不到节点段（实例化子场景中的节点暂不能编辑）
tools/scene_builder/inspector_preset = 锚点预设
tools/scene_builder/inspector_cat_layout = 布局
tools/scene_builder/inspector_cat_rect = 矩形
tools/scene_builder/inspector_cat_visibility = 可见性
tools/scene_builder/inspector_cat_misc = 其他
tools/scene_builder/inspector_bad_value = 该值无法写入 tscn。
tools/scene_builder/inspector_in_file_tooltip = 存储在 tscn 文件中
tools/scene_builder/inspector_container_banner = 这个节点由容器管理：锚点和偏移由父节点重新计算，在这里修改不会生效。
tools/scene_builder/err_add_failed = 错误：无法创建这种类型的节点。
tools/scene_builder/err_add_parent_missing = 错误：在 tscn 中找不到父节点段（不支持实例化子场景的父节点）。
tools/scene_builder/err_del_root = 错误：不能删除场景根节点。
tools/scene_builder/err_del_none = 错误：请选择一个要删除的模组节点。
